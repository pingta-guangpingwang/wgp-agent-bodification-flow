name: Interoperability report / 互操作报告
description: Share importer, compiler, replay, or conformance evidence for one platform. / 分享某个平台的导入、编译、回放或合规证据。
title: "[interop] "
labels: ["interoperability"]
body:
  - type: input
    id: platform
    attributes:
      label: Platform and pinned version / 平台与固定版本
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Adapter version or commit / 适配器版本或提交
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Claimed level / 声明等级
      options: [C0, C1, C2, C3, Projection Conformance only]
    validations:
      required: true
  - type: dropdown
    id: interchangeability
    attributes:
      label: Interchangeability evidence / 互换证据
      description: Select only for a directed A→B assessment under one pinned CompatibilityProfile; this is independent from C0–C3.
      options: [Not assessed, I0 Closed, I1 Contract-exposed, I2 Data-aligned, I3 Chain-verified, I4 Evidence-backed controlled interchangeability]
    validations:
      required: true
  - type: textarea
    id: exact-references
    attributes:
      label: Exact releases and profile / 精确发布与 Profile
      description: Provide id + version + contentHash for the baseline, candidate, ModuleDataContract, package, profile, suite, and report when applicable. Do not use latest or a version range.
    validations:
      required: true
  - type: input
    id: contract-binding
    attributes:
      label: Contract binding / 契约绑定
      description: Provide the recipe ID, contract binding ID, and directed producer→consumer endpoint pair.
    validations:
      required: true
  - type: dropdown
    id: compatibility-method
    attributes:
      label: Schema-compatibility method / Schema 兼容证明方法
      options: [Exact contract digest, Bounded compatibility checker, Exact adapter with scoped execution evidence, Not claimed]
    validations:
      required: true
  - type: input
    id: evidence-window
    attributes:
      label: Runtime-stability evidence window / 运行稳定证据时窗
      description: State the environment, assessedAt, expiresAt, and whether any supporting report is revoked.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and known semantic loss / 证据与已知语义损失
      description: Link reproducible, non-sensitive fixtures and name every exception.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Claim boundary / 声明边界
      options:
        - label: I am not implying endorsement or official certification. / 我没有暗示官方背书或认证。
          required: true
